		<script>
			function validate_password(){
				x = z.value
				p = [81, 56, 125, 73, 122, 109, 57, 59, 59, 63]
				o = ''
				for(i=0; i<p.length;i++) o += String.fromCharCode(p[i]^8)
				if (o == x){
				g = ''

				h = [1402, 1389, 1407, 1346, 1288, 1292, 1368, 1280, 1295, 1289, 1288, 1371, 1288, 1289, 1373, 1291, 1288, 1371, 1373, 1294, 1368, 1290, 1289, 1372, 1371, 1281, 1290, 1280, 1375, 1281, 1290, 1280, 1294, 1281, 1290, 1292, 1348]
				for(i=0; i<h.length;i++) g += String.fromCharCode(h[i]^q)
				alert('You got it: ' + g)} else {alert('Wrong password!')}
				o = ''
			}
		</script>
	</head>
	<body>
		<div class="center">
